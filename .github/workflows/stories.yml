name: Stories MCR

# O agendamento do GitHub atrasa (já chegou a 3 h), então ele não decide o horário dos Stories.
# Cada execução fica vigiando por ~5h40: a cada minuto publica o que venceu (depois de conferir
# os dados) e grava o registro no repositório. Antes de terminar, ela chama a próxima execução,
# formando uma corrente contínua. Os agendamentos abaixo só religam a corrente se ela cair.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Forçar um Story (1 a 6) agora'
        required: false
      previa:
        description: 'Só gerar os 6 Stories de agora, sem publicar (baixe em Artifacts)'
        type: boolean
        default: false

# uma execução por vez; a seguinte espera na fila
concurrency:
  group: stories
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vigiar e publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_CHAVE: ${{ secrets.IG_CHAVE }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "stories-bot"
          git config user.email "stories-bot@users.noreply.github.com"
          salvar() {
            git add registro dados-base
            git diff --cached --quiet && return 0
            git commit -q -m "registro: stories publicados"
            for i in 1 2 3; do git pull -q --rebase origin master && git push -q && return 0; sleep 5; done
          }
          if [ "${{ github.event.inputs.previa }}" = "true" ]; then
            SEM_CONFERENCIA=1 node gerar.js todos
            exit 0
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            node publicar.js slot "${{ github.event.inputs.slot }}"
            salvar
            exit 0
          fi
          fim=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            git pull -q --rebase origin master || true
            node publicar.js agora || echo "::warning::tentativa com erro às $(TZ=America/Sao_Paulo date +%H:%M); repete no próximo minuto"
            salvar || true
            if [ -f alerta.txt ]; then
              while read -r linha; do
                gh issue create -R "$GITHUB_REPOSITORY" --title "$(jq -r .titulo <<<"$linha")" --body "$(jq -r .corpo <<<"$linha")" || true
              done < alerta.txt
              rm -f alerta.txt
            fi
            sleep 60
          done
      - name: Chamar a próxima execução
        if: always() && github.event.inputs.previa != 'true' && github.event.inputs.slot == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run stories.yml -R "$GITHUB_REPOSITORY" --ref master
      - name: Guardar as imagens geradas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stories-${{ github.run_id }}
          path: gerados/
          if-no-files-found: ignore
          retention-days: 14
