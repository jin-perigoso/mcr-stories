<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Story comunidade</title>
<style>
@font-face{font-family:Raleway;src:url('../modelos/fonts/Raleway-latin.woff2') format('woff2');font-weight:100 900}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;color:#fff;font-family:Raleway,sans-serif;font-weight:500;font-feature-settings:'lnum','tnum';
 background:radial-gradient(1300px 1000px at 50% 112%,rgba(244,106,37,.45),transparent 66%),
 radial-gradient(1000px 900px at 105% -8%,rgba(14,66,122,.75),transparent 65%),

.qr{background:#fff;padding:22px;border-radius:24px}.qr img{width:250px;display:block}
.cta p{font-size:40px;line-height:1.3;color:#cfdbe7}

<img class="up" src="../modelos/marca-up.png" alt="">
<div class="marca"><img class="mcr" src="../modelos/logo-mcrup-site.png" alt=""><img class="eqi" src="../modelos/logo-eqi.png" alt=""></div>
<h1>Faça parte da<span>nossa comunidade.</span></h1>
